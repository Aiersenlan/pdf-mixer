<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF 合併與頁面編輯器</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
</head>
<body>

<!-- ============ 頂部標題列 ============ -->
<header class="topbar">
  <div class="topbar-left">
    <button class="icon-btn" id="btn-reset" title="重設全部">
      <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 1 1-6 6H4a8 8 0 1 0 8-8z"/></svg>
    </button>
    <h1 class="app-title">合併</h1>
  </div>
  <div class="topbar-right">
    <button class="btn-ghost" id="btn-copy-link" disabled title="先按「產生連結」才能複製">複製連結</button>
    <button class="btn-ghost" id="btn-share-cancel" hidden>取消</button>
    <button class="btn-ghost" id="btn-share">產生連結</button>
    <button class="btn-primary" id="btn-download">下載檔案</button>
  </div>
</header>

<!-- ============ 工具列 ============ -->
<nav class="toolbar">
  <div class="tabs">
    <button class="tab" data-view="files">
      <svg viewBox="0 0 24 24"><path d="M6 2h7l5 5v15H6zM13 2v6h5"/></svg>
      檔案
    </button>
    <button class="tab is-active" data-view="pages">
      <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg>
      頁面
    </button>
  </div>

  <div class="divider"></div>

  <div class="tool-group">
    <div class="menu-anchor">
      <button class="tool-btn" id="btn-add">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        新增 <span class="caret">▾</span>
      </button>
      <div class="menu" id="menu-add" hidden>
        <button data-act="add-file">新增文件…</button>
        <button data-act="add-blank-end">在結尾加入空白頁</button>
        <div class="menu-sep"></div>
        <button data-act="split-between-docs">在文件之間加入分割符號</button>
        <button data-act="blank-between-docs">在文件之間加入空白頁</button>
      </div>
    </div>

    <button class="tool-btn icon-only" id="btn-undo" title="復原 (Ctrl+Z)" disabled>
      <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
    <button class="tool-btn icon-only" id="btn-redo" title="重做 (Ctrl+Y)" disabled>
      <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9H10a6 6 0 0 0 0 12h3"/></svg>
    </button>
    <button class="tool-btn icon-only" id="btn-delete" title="刪除所選 (Delete)" disabled>
      <svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>
    </button>
    <button class="tool-btn icon-only" id="btn-rotate" title="旋轉所選 (R)" disabled>
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>

    <div class="divider"></div>

    <button class="tool-btn" id="btn-expand" title="展開／收合" disabled>
      <span class="ico"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg></span>
      <span class="label">全部展開</span>
    </button>
  </div>
</nav>

<!-- ============ 選取列 ============ -->
<div class="selectbar">
  <label class="check-line">
    <input type="checkbox" id="chk-all">
    <span>全選</span>
  </label>
  <span class="sel-count" id="sel-count"></span>

  <div class="selectbar-right">
    <div class="menu-anchor">
      <button class="tool-btn" id="btn-sort" title="排序">
        <svg viewBox="0 0 24 24"><path d="M6 4v16M6 20l-3-3M6 20l3-3"/><path d="M13 6h8M13 11h6M13 16h4"/></svg>
        <span class="caret">▾</span>
      </button>
      <div class="menu" id="menu-sort" hidden>
        <button data-sort="name-asc">檔案名稱 A → Z</button>
        <button data-sort="name-desc">檔案名稱 Z → A</button>
        <button data-sort="reverse">反轉目前順序</button>
        <button data-sort="original">還原成加入時的順序</button>
      </div>
    </div>
    <button class="tool-btn icon-only" id="btn-view-list" title="清單檢視">
      <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>
    </button>
    <button class="tool-btn icon-only is-active" id="btn-view-grid" title="格狀檢視">
      <svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z"/></svg>
    </button>
    <div class="zoom-slider" title="縮圖大小">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="range" id="thumb-size" min="90" max="220" step="2" value="132">
    </div>
  </div>
</div>

<!-- ============ 主要工作區 ============ -->
<main id="workspace" class="workspace">
  <div id="board" class="board"></div>
  <div id="empty-state" class="empty-state" hidden>
    <div class="empty-inner">
      <svg class="empty-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <p class="empty-title">拖曳檔案到這裡，或點擊選擇檔案</p>
      <p class="empty-sub">支援 PDF、JPG、PNG、WebP</p>
      <button class="btn-primary" id="btn-empty-add">選擇檔案</button>
      <button class="btn-ghost" id="btn-load-samples">載入範例檔案</button>
    </div>
  </div>
</main>

<!-- 拖放整頁覆蓋層 -->
<div class="drop-overlay" id="drop-overlay" hidden>
  <div class="drop-box">放開以加入檔案</div>
</div>

<!-- 插入位置的浮動選單 -->
<div class="menu floating" id="menu-insert" hidden>
  <button data-act="insert-file">新增文件</button>
  <button data-act="insert-blank">添加空白頁</button>
  <button data-act="insert-split">新增分割符號</button>
</div>

<!-- 預覽視窗 -->
<div class="modal" id="preview-modal" hidden>
  <div class="modal-bar">
    <span id="preview-title"></span>
    <div class="modal-actions">
      <button class="icon-btn" id="preview-prev" title="上一頁">‹</button>
      <button class="icon-btn" id="preview-next" title="下一頁">›</button>
      <button class="icon-btn" id="preview-rotate" title="旋轉">
        <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
      </button>
      <button class="icon-btn" id="preview-close" title="關閉 (Esc)">✕</button>
    </div>
  </div>
  <div class="modal-body"><canvas id="preview-canvas"></canvas></div>
</div>

<a class="gh-link" href="https://github.com/Aiersenlan/pdf-mixer" target="_blank" rel="noopener" title="原始碼在 GitHub">
  <svg viewBox="0 0 16 16" aria-hidden="true"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>
</a>

<div class="toast" id="toast" hidden></div>
<div class="busy" id="busy" hidden><div class="spinner"></div><span id="busy-text">處理中…</span></div>

<input type="file" id="file-input" accept="application/pdf,image/png,image/jpeg,image/webp" multiple hidden>

<script src="vendor/pdf.min.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
